
name: Generate Arabic YouTube Script

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate script with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_script.py

      - name: Save generated script
        uses: actions/upload-artifact@v4
        with:
          name: arabic-video-script
          path: output/script.txt
          if-no-files-found: error
